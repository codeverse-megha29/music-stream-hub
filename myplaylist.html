<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist</title>
    <style>
        body {
            background-color: #111827;
            color:white;
            font-family: Gill Sans;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #1f2937;
            padding: 20px;
        }
        .header h1 {
            margin:0;
            font-size:40px;
        }
        .playlist-container{
            background-color: #181818;
            width: 300px;
            margin:50px auto;
            padding:20px;
            border-radius: 15px;
        }
        .playlist-container img {
            width:100%;
            border-radius: 10px;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            background-color:crimson;
            color:white;
            border:none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>My Spotify Playlists</h1>
    </div>
    <div class="playlists-wrapper">
    <div class="playlist-container">
        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500" alt="Playlist 1 Cover">
        <h2>Chill Vibes</h2>
        <p>Perfect for relaxing</p>
        <a href="https://open.spotify.com/playlist/6o9o7okAnkTls2AVZnwjj5?si=dSQh0osdSoa5ElrKI9DtZA&nd=1&dlsi=b27e5d39dac8492b" target="_blank">
            <button>Listen on Spotify</button>
        </a>
    </div>
    <div class="playlist-container">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Playlist 2 Cover">
        <h2>Workout Mix</h2>
        <p>High energy beats to keep you moving</p>
        <a href="https://open.spotify.com/playlist/2V3EDCarvvUq5PdsXuFpF4?si=x_QgCyQCQ2GDWbEeO7_cFA&pi=8aH1HvxBQTayg" target="_blank">
            <button>Listen on Spotify</button>
        </a>
    </div>
    <div class="playlist-container">
        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500" alt="Playlist 3 Cover">
        <h2>late Night Jams</h2>
        <p>Deep bass and retro lofi tracks</p>
        <a href="https://open.spotify.com/playlist/3w6PrxSgZmBMJjjLvvDe7w?si=r3szp9eUTjGz_mALIf1Ohg" target="_blank">
            <button>Listen on Spotify</button>
        </a>
    </div>
    </div>
</body>
</html>
